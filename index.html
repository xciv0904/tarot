<script>
/* Astronomy Engine is kept as a local, version-pinned asset and loaded only when
   a natal/synastry calculation is actually needed. This keeps the reading and
   library screens independent from third-party network availability. */
var astronomyLoadPromise = null;
function ensureAstronomyLoaded() {
  if (window.Astronomy) return Promise.resolve(window.Astronomy);
  if (astronomyLoadPromise) return astronomyLoadPromise;
  astronomyLoadPromise = new Promise(function (resolve, reject) {
    var script = document.createElement('script');
    script.src = 'assets/vendor/astronomy-engine-2.1.19.min.js';
    script.async = true;
    script.onload = function () {
      if (window.Astronomy) resolve(window.Astronomy);
      else reject(new Error('Astronomy Engine loaded without global API'));
    };
    script.onerror = function () { reject(new Error('Astronomy Engine failed to load')); };
    document.head.appendChild(script);
  }).catch(function (err) {
    astronomyLoadPromise = null;
    throw err;
  });
  return astronomyLoadPromise;
}


/* 西洋占星資料檔（astrology-*.js）只在使用者切到「星盤」分頁時才動態載入，
   做法跟上面 Astronomy Engine 的按需載入一致——首頁與占卜分頁不需要用到
   這些資料，延後載入可以縮短第一次進站時要處理的程式碼量。 */
var astrologyDataLoadPromise = null;
var ASTROLOGY_DATA_FILES = [
  'js/data/astrology-core-data.js',
  'js/data/astrology-points-data.js',
  'js/data/astrology-placement-templates.js',
  'js/data/astrology-aspect-data.js',
  'js/data/astrology-knowledge-layer.js',
  'js/data/astrology-knowledge-dataset.js',
  'js/data/astrology-natal-topics-data.js',
  /* 合盤／二次推運／二十八星宿／回歸與流年運勢的程式碼（約 158KB）從 app.js 拆出來，
     排在這份清單最後——它只有在使用者切到「星盤」分頁時才需要，而且一定在 app.js
     之後才執行，所以可以安全地沿用 app.js 定義的共用工具函式。 */
  'js/data/astro-charts.js',
  'js/data/astro-advanced.js'
];
function ensureAstrologyDataLoaded() {
  if (window.PLANET_DEFS) return Promise.resolve();
  if (astrologyDataLoadPromise) return astrologyDataLoadPromise;
  astrologyDataLoadPromise = ASTROLOGY_DATA_FILES.reduce(function (chain, src) {
    return chain.then(function () {
      return new Promise(function (resolve, reject) {
        var script = document.createElement('script');
        script.src = src;
        script.onload = function () { resolve(); };
        script.onerror = function () { reject(new Error('Failed to load ' + src)); };
        document.head.appendChild(script);
      });
    });
  }, Promise.resolve()).catch(function (err) {
    astrologyDataLoadPromise = null;
    throw err;
  });
  return astrologyDataLoadPromise;
}

/* 78 張牌的完整牌義（RICH，約 98KB）同樣改成按需載入。它佔原本 reading-data.js
   六成的體積，但首頁只用得到「今日一牌」那一張，讓它擋住首次繪製並不划算。
   讀取端全部都有短牌義可以降級，所以先畫畫面、資料晚一點到並不會出現空白；
   載入完成後補掛 attachRichMeanings() 再重畫一次，使用者只會看到文字變完整。 */
var readingRichLoadPromise = null;
function ensureReadingRichLoaded() {
  if (window.RICH) return Promise.resolve();
  if (readingRichLoadPromise) return readingRichLoadPromise;
  readingRichLoadPromise = new Promise(function (resolve, reject) {
    var script = document.createElement('script');
    script.src = 'js/data/reading-rich-data.js';
    script.onload = function () { resolve(); };
    script.onerror = function () { reject(new Error('Failed to load reading-rich-data.js')); };
    document.head.appendChild(script);
  }).then(function () {
    if (typeof attachRichMeanings === 'function') attachRichMeanings();
    if (typeof render === 'function') render();
  }).catch(function (err) {
    readingRichLoadPromise = null;
    throw err;
  });
  return readingRichLoadPromise;
}

/* 首次繪製完成後，趁瀏覽器空檔就把牌義補載進來——使用者通常還在看首頁的今日一牌，
   等他點進占卜或牌典時資料早就到了，實際上不會感覺到任何等待。 */
window.addEventListener('load', function () {
  var kick = function () { ensureReadingRichLoaded().catch(function () {}); };
  if (window.requestIdleCallback) window.requestIdleCallback(kick, { timeout: 2000 });
  else setTimeout(kick, 200);
});
</script>
<!-- defer：三支檔案合計約 950KB，維持原本的執行順序（defer 保證依序執行、且都在
     HTML 解析完成後才跑），但下載階段不再和 HTML 解析互相卡住。 -->
<script defer src="js/data/card-images.js"></script>

<script defer src="js/app.js"></script>
<script>

</script>
