<style>
  /* ================================================================
     設計 Token（單一事實來源）
     ----------------------------------------------------------------
     這份專案的畫面是用 JS 字串組出來的 inline style，歷史上同一個顏色
     在不同檔案被硬寫了幾百次（#c9a96e 出現 184 次、#f0e9d8 134 次）。
     這裡先把「已經在用的值」原封不動收斂成 CSS variables，數值完全不變，
     所以不會造成任何視覺回歸；之後新增或修改的區塊一律改用 var(--…)，
     舊的 inline 值可以逐步替換而不需要一次性大改。
     ================================================================ */
  :root{
    /* 色票 —— 底層 */
    --bg:#14111a;
    --bg-raised:#1a1622;
    --bg-sunken:#241f2e;
    --surface:rgba(255,255,255,.025);
    --surface-strong:rgba(255,255,255,.04);
    /* 色票 —— 文字 */
    --text:#f0e9d8;
    --text-secondary:rgba(240,233,216,.78);
    --text-muted:rgba(240,233,216,.6);
    /* .35–.4 的灰在深色底上低於 4.5:1，正文一律不使用，只允許用在
       純裝飾或已經有其他非顏色標示的補充字。 */
    --text-faint:rgba(240,233,216,.5);
    /* 色票 —— 品牌與狀態 */
    --brand:#c9a96e;
    --brand-bright:#e6cd9a;
    --brand-dim:rgba(201,169,110,.25);
    --brand-line:rgba(201,169,110,.3);
    --brand-wash:rgba(201,169,110,.08);
    --success:#9bc5a3;
    --warning:#d9a0a0;
    --danger:#d67878;
    --info:#8fc7f4;
    /* 邊框 */
    --border:rgba(201,169,110,.25);
    --border-strong:rgba(201,169,110,.4);
    --border-hair:rgba(201,169,110,.15);
    /* 字級層級 */
    --fs-display:20px;
    --fs-h2:16px;
    --fs-h3:14px;
    --fs-body:13px;
    --fs-sm:12px;
    --fs-xs:11px;
    --lh-tight:1.5;
    --lh-body:1.8;
    --fw-regular:400;
    --fw-medium:500;
    --fw-bold:600;
    --font-sans:'Noto Sans TC',sans-serif;
    --font-serif:'Noto Serif TC',serif;
    --font-latin:'EB Garamond',serif;
    /* 間距 */
    --sp-1:4px; --sp-2:6px; --sp-3:8px; --sp-4:12px; --sp-5:16px; --sp-6:22px; --sp-7:28px;
    /* 形狀 */
    --radius-sm:8px; --radius-md:10px; --radius-lg:14px; --radius-pill:22px;
    --shadow-card:0 1px 0 rgba(255,255,255,.02) inset;
    /* 控制項 */

    --control-h-sm:36px;
    --field-h:40px;
    /* 動態 */
    --motion-fast:120ms;

  /* ---- 手機水平溢出防線 ----------------------------------------
     長英文字串、寬表格與 SVG 是這個專案最容易撐破 320px 的三個來源。
     這裡只約束「會溢出的元素」，不用 overflow-x:hidden 遮蓋問題，

  #view{overflow-wrap:anywhere}

  /* iOS 在 font-size < 16px 的欄位聚焦時會自動放大整頁，造成水平捲動。 */
  @supports (-webkit-touch-callout:none){
    #view input,#view textarea,#view select{font-size:16px}

  /* ---- 共用元件類別（新程式碼使用，舊 inline style 不受影響） ---- */
  .md-h2{font:var(--fw-bold) var(--fs-h2)/1.5 var(--font-serif);color:var(--text);margin:0}
  .md-h3{font:var(--fw-bold) var(--fs-h3)/1.5 var(--font-serif);color:var(--brand-bright);margin:0}
  .md-note{font:var(--fw-regular) var(--fs-xs)/var(--lh-body) var(--font-sans);color:var(--text-muted)}
  .md-prose{max-width:var(--measure)}
  /* 內容類型徽章：把「排盤事實 / 綜合判斷 / 解讀文字」在視覺上分開，

    border-radius:var(--radius-sm);padding:4px 8px;border:1px solid currentColor;white-space:nowrap}
  .md-kind--fact{color:var(--info)}
  .md-kind--rule{color:var(--brand)}
  .md-kind--reading{color:var(--success)}
  .md-kind--limit{color:var(--warning)}
  /* 狀態訊息：loading / error / empty / success 共用同一個外觀語言，
     每一種都同時具備圖示、文字前綴與顏色，不單靠顏色傳達狀態。 */
  .md-status{display:flex;gap:8px;align-items:flex-start;border-radius:var(--radius-md);
    padding:10px 13px;margin-top:var(--sp-4);
    font:var(--fw-regular) var(--fs-xs)/1.75 var(--font-sans);border:1px solid var(--border)}
  .md-status--error{border-color:rgba(214,120,120,.45);background:rgba(214,120,120,.08);color:var(--text-secondary)}
  .md-status--success{border-color:rgba(155,197,163,.45);background:rgba(155,197,163,.08);color:var(--text-secondary)}
  .md-status--info{border-color:var(--border);background:var(--surface);color:var(--text-muted)}
  .md-status__icon{flex:none;font-size:13px;line-height:1.4}
  /* 目前命盤身分列：使用者隨時知道畫面上這些結果是「哪一張盤」算出來的。 */
  .md-chartbar{border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface);
    padding:10px 13px;margin-top:var(--sp-4)}
  .md-chartbar__row{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:5px}
  .md-chartbar__item{font:var(--fw-regular) 10.5px/1.6 var(--font-sans);color:var(--text-muted);white-space:nowrap}
  .md-chartbar__item b{color:var(--text-secondary);font-weight:var(--fw-medium)}

  @media (prefers-reduced-motion: reduce) {
    *,*::before,*::after{
      animation-duration:.01ms!important;
      animation-iteration-count:1!important;
      scroll-behavior:auto!important;
      transition-duration:.01ms!important
    }
    .home-ambient-video{display:none!important}
  }
</style>

<script>
/* Astronomy Engine is kept as a local, version-pinned asset and loaded only when
   a natal/synastry calculation is actually needed. This keeps the reading and
   library screens independent from third-party network availability. */
var astronomyLoadPromise = null;
function ensureAstronomyLoaded() {
  if (window.Astronomy) return Promise.resolve(window.Astronomy);
  if (astronomyLoadPromise) return astronomyLoadPromise;
  astronomyLoadPromise = new Promise(function (resolve, reject) {
    var script = document.createElement('script');
    script.src = 'assets/vendor/astronomy-engine-2.1.19.min.js';
    script.async = true;
    script.onload = function () {
      if (window.Astronomy) resolve(window.Astronomy);
      else reject(new Error('Astronomy Engine loaded without global API'));
    };
    script.onerror = function () { reject(new Error('Astronomy Engine failed to load')); };
    document.head.appendChild(script);
  }).catch(function (err) {
    astronomyLoadPromise = null;
    throw err;
  });
  return astronomyLoadPromise;
}


/* 西洋占星資料檔（astrology-*.js）只在使用者切到「星盤」分頁時才動態載入，
   做法跟上面 Astronomy Engine 的按需載入一致——首頁與占卜分頁不需要用到
   這些資料，延後載入可以縮短第一次進站時要處理的程式碼量。 */
var astrologyDataLoadPromise = null;
var ASTROLOGY_DATA_FILES = [
  'js/data/astrology-core-data.js',
  'js/data/astrology-points-data.js',
  'js/data/astrology-placement-templates.js',
  'js/data/astrology-aspect-data.js',
  'js/data/astrology-knowledge-layer.js',
  'js/data/astrology-knowledge-dataset.js',
  'js/data/astrology-natal-topics-data.js',
  /* 合盤／二次推運／二十八星宿／回歸與流年運勢的程式碼（約 158KB）從 app.js 拆出來，
     排在這份清單最後——它只有在使用者切到「星盤」分頁時才需要，而且一定在 app.js
     之後才執行，所以可以安全地沿用 app.js 定義的共用工具函式。 */
  'js/data/astro-charts.js',
  'js/data/relationship-timing.js',
  'js/data/astro-advanced.js'
];
function ensureAstrologyDataLoaded() {
  if (window.PLANET_DEFS) return Promise.resolve();
  if (astrologyDataLoadPromise) return astrologyDataLoadPromise;
  astrologyDataLoadPromise = ASTROLOGY_DATA_FILES.reduce(function (chain, src) {
    return chain.then(function () {
      return new Promise(function (resolve, reject) {
        var script = document.createElement('script');
        script.src = src;
        script.onload = function () { resolve(); };
        script.onerror = function () { reject(new Error('Failed to load ' + src)); };
        document.head.appendChild(script);
      });
    });
  }, Promise.resolve()).catch(function (err) {
    astrologyDataLoadPromise = null;
    throw err;
  });
  return astrologyDataLoadPromise;
}

/* 78 張牌的完整牌義（RICH，約 98KB）同樣改成按需載入。它佔原本 reading-data.js
   六成的體積，但首頁只用得到「今日一牌」那一張，讓它擋住首次繪製並不划算。
   讀取端全部都有短牌義可以降級，所以先畫畫面、資料晚一點到並不會出現空白；
   載入完成後補掛 attachRichMeanings() 再重畫一次，使用者只會看到文字變完整。 */
var readingRichLoadPromise = null;
function ensureReadingRichLoaded() {
  if (window.RICH) return Promise.resolve();
  if (readingRichLoadPromise) return readingRichLoadPromise;
  readingRichLoadPromise = new Promise(function (resolve, reject) {
    var script = document.createElement('script');
    script.src = 'js/data/reading-rich-data.js';
    script.onload = function () { resolve(); };
    script.onerror = function () { reject(new Error('Failed to load reading-rich-data.js')); };
    document.head.appendChild(script);
  }).then(function () {
    if (typeof attachRichMeanings === 'function') attachRichMeanings();
    if (typeof render === 'function') render();
  }).catch(function (err) {
    readingRichLoadPromise = null;
    throw err;
  });
  return readingRichLoadPromise;
}

/* 首頁背景影片：13.5MB，而且原本是寫死在 HTML 裡的 <video autoplay>。
   非首頁時雖然有 display:none，但 display:none 完全不會阻止瀏覽器下載——
   等於任何人一進站、不管停在哪一個分頁，都在背景吃掉 13.5MB 流量。
   這支影片是純裝飾（灰階、透明度 .44、指標事件關閉），為它付這個代價不合理。

   改成在首屏繪製完成、瀏覽器有空檔時才注入，而且下列任一條件成立就完全不載入：
     · 使用者開了「減少動態效果」
     · 瀏覽器回報省流量模式（Save-Data）
     · 連線是 2G／3G 或 downlink 過低
     · 目前不在首頁
   不載入時畫面完全正常——底下本來就有 CSS 星空漸層背景。 */
var HOME_AMBIENT_SRC = 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260314_131748_f2ca2a28-fed7-44c8-b9a9-bd9acdd5ec31.mp4';
var homeAmbientInjected = false;
function shouldLoadHomeAmbient() {
  try {
    if (!document.body.classList.contains('is-home')) return false;
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return false;
    var conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
    if (conn) {
      if (conn.saveData) return false;
      if (/(^|-)2g$/.test(conn.effectiveType || '')) return false;
      if (typeof conn.downlink === 'number' && conn.downlink > 0 && conn.downlink < 2) return false;
    }
    return true;
  } catch (e) { return false; }
}
function maybeInjectHomeAmbient() {
  if (homeAmbientInjected || !shouldLoadHomeAmbient()) return;
  var slot = document.getElementById('home-ambient-slot');
  if (!slot) return;
  homeAmbientInjected = true;
  var v = document.createElement('video');
  v.className = 'home-ambient-video';
  v.autoplay = true; v.loop = true; v.muted = true; v.playsInline = true;
  v.setAttribute('muted', ''); v.setAttribute('playsinline', ''); v.setAttribute('aria-hidden', 'true');
  v.preload = 'auto';
  v.src = HOME_AMBIENT_SRC;
  slot.appendChild(v);
  v.play().catch(function () {});
}

/* 首次繪製完成後，趁瀏覽器空檔就把牌義補載進來——使用者通常還在看首頁的今日一牌，
   等他點進占卜或牌典時資料早就到了，實際上不會感覺到任何等待。 */
window.addEventListener('load', function () {
  var kick = function () { ensureReadingRichLoaded().catch(function () {}); };
  if (window.requestIdleCallback) window.requestIdleCallback(kick, { timeout: 2000 });
  else setTimeout(kick, 200);
  /* 背景影片排在牌義之後——它純裝飾，優先權比實際內容低。 */
  var kickAmbient = function () { maybeInjectHomeAmbient(); };
  if (window.requestIdleCallback) window.requestIdleCallback(kickAmbient, { timeout: 4000 });
  else setTimeout(kickAmbient, 1200);
});
</script>

     HTML 解析完成後才跑），但下載階段不再和 HTML 解析互相卡住。 -->

<script>
/* 錯誤邊界。整個畫面是 view.innerHTML = render() 一次寫進去的，所以 render 途中
   丟出例外＝畫面停在上一個狀態或直接空白，而且完全沒有訊息。使用者只會看到
   「壞掉了」，也不知道能做什麼。至少要說清楚發生什麼、給一個重新載入的按鈕，
   並且明講資料還在——本站沒有伺服器，出錯不會弄丟任何東西。 */
(function () {
  var shown = false;
  function logFatal(error) {
    try {
      console.error(error);
      if (error && error.stack) console.error(error.stack);
    } catch (logError) {}
  }
  function showFatal(detail) {
    if (shown) return;
    shown = true;
    var box = document.createElement('div');
    box.setAttribute('role', 'alert');
    box.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#241c22;border-top:1px solid #d99b5f;padding:14px 16px calc(14px + env(safe-area-inset-bottom));font:400 12px "Noto Sans TC",sans-serif;color:#f0e9d8;line-height:1.8';
    box.innerHTML = '<div style="font:500 13px \'Noto Sans TC\',sans-serif;color:#e6cd9a">這個畫面出了點問題</div>'
      + '<div style="margin-top:5px;color:rgba(240,233,216,.8)">你的抽牌歷史與星盤資料都還在這台裝置上，沒有被影響。重新載入通常就會恢復。</div>'
      + '<div style="display:flex;gap:9px;margin-top:11px;flex-wrap:wrap">'
      + '<button type="button" id="fatal-reload" style="flex:1 1 auto;min-height:44px;background:rgba(201,169,110,.16);border:1px solid #c9a96e;color:#f0e9d8;font:500 12px \'Noto Sans TC\',sans-serif;border-radius:10px;cursor:pointer">重新載入</button>'
      + '<button type="button" id="fatal-dismiss" style="flex:0 0 auto;min-height:44px;padding:0 16px;background:none;border:1px solid rgba(201,169,110,.35);color:rgba(240,233,216,.75);font:400 12px \'Noto Sans TC\',sans-serif;border-radius:10px;cursor:pointer">先關掉</button>'
      + '</div>'
      + '<details style="margin-top:9px"><summary style="min-height:32px;display:flex;align-items:center;cursor:pointer;color:rgba(240,233,216,.55);font-size:11px">技術細節</summary>'
      + '<div style="color:rgba(240,233,216,.55);font-size:11px;word-break:break-all;margin-top:4px"></div></details>';
    var d = box.querySelector('details div');
    if (d) d.textContent = String(detail || '').slice(0, 400);
    document.body.appendChild(box);
    var r = document.getElementById('fatal-reload');
    if (r) r.onclick = function () { location.reload(); };
    var x = document.getElementById('fatal-dismiss');
    if (x) x.onclick = function () { box.remove(); shown = false; };
  }
  window.addEventListener('error', function (e) {
    /* 圖片、樣式等資源載入失敗會冒泡成 error 事件但沒有 e.error——
       那些各自有自己的降級處理（例如牌圖的 onerror），不該跳全站錯誤。 */
    if (!e || !e.error) return;
    logFatal(e.error);
    showFatal(e.message + ' @ ' + (e.filename || '') + ':' + (e.lineno || ''));
  });
  window.addEventListener('unhandledrejection', function (e) {
    var reason = e && e.reason;
    logFatal(reason);
    showFatal((reason && (reason.stack || reason.message)) || 'unhandled rejection');
  });
})();
if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
</script>
